    function initTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = templatesMeta.map((t, idx) => `
        <button class="tab-btn ${idx === 0 ? 'active' : ''}" onclick="selectTemplate(${idx})">
          <span class="tab-num">PLANTILLA #${t.id}</span>
          <span class="tab-name">${t.title.replace(/^\d+\.\s*/, '')}</span>
          <span class="tab-file">${t.file}</span>
        </button>
      `).join('');
      selectTemplate(0);
    }

    async function selectTemplate(idx) {
      currentIndex = idx;
      const meta = templatesMeta[idx];
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.getElementById('currentTitle').textContent = meta.title;
      document.getElementById('currentDesc').textContent = meta.desc;
      document.getElementById('openRawLink').href = meta.file;
      document.getElementById('currentVars').innerHTML = meta.vars.map(v => `<span class="var-pill">${v}</span>`).join('');

      if (!rawCache[meta.file]) {
        try {
          const res = await fetch(meta.file);
          rawCache[meta.file] = await res.text();
        } catch (err) {
          rawCache[meta.file] = '';
        }
      }
      renderCurrent();
    }

    function applyDemoValues(html) {
      if (!useSampleData) return html;
      return html.replace(/\{\{\s*\$json\.([a-zA-Z0-9_]+)\s*\}\}/g, (match, key) => {
        if (key === 'codigo' && currentIndex === 9) return '849201';
        return sampleValues[key] !== undefined ? sampleValues[key] : match;
      });
    }

    function renderCurrent() {
      const meta = templatesMeta[currentIndex];
      const rawHtml = rawCache[meta.file] || '';
      const iframe = document.getElementById('previewIframe');
      const codeViewer = document.getElementById('codeViewer');

      if (rawHtml) {
        iframe.removeAttribute('src');
        iframe.srcdoc = applyDemoValues(rawHtml);
        codeViewer.value = rawHtml;
      } else {
        iframe.removeAttribute('srcdoc');
        iframe.src = meta.file;
        codeViewer.value = 'Abre esta página mediante un servidor local o abre directamente el archivo ' + meta.file + ' para copiar su código fuente.';
      }
    }

    function toggleSampleData() {
      useSampleData = !useSampleData;
      document.getElementById('toggleDataBtn').textContent = useSampleData
        ? 'Modo: Datos Demo Realistas'
        : 'Modo: Variables n8n ({{ $json }})';
      renderCurrent();
    }

    function toggleCodeView() {
      showCode = !showCode;
      document.getElementById('previewIframe').style.display = showCode ? 'none' : 'block';
      document.getElementById('codeViewer').style.display = showCode ? 'block' : 'none';
      document.getElementById('toggleCodeBtn').textContent = showCode ? 'Ver Vista Previa Visual' : 'Ver Código HTML n8n';
    }

    async function copyCurrentTemplate() {
      const meta = templatesMeta[currentIndex];
      const rawHtml = rawCache[meta.file];
      const btn = document.getElementById('copyBtn');
      if (rawHtml) {
        await navigator.clipboard.writeText(rawHtml);
        btn.textContent = '✓ ¡Código Copiado al Portapapeles!';
        setTimeout(() => { btn.textContent = '📋 Copiar HTML para n8n'; }, 2200);
      }
    }

    initTabs();
  </script>
