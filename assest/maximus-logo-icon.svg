<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradiente Metálico Cromado / Plateado para la Casa y Monograma M -->
        <linearGradient id="maximus-house-silver" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="40%" stop-color="#F8FAFC"/>
            <stop offset="80%" stop-color="#CBD5E1"/>
            <stop offset="100%" stop-color="#94A3B8"/>
        </linearGradient>

        <!-- Gradiente Esmeralda Joya para la Flecha de Crecimiento y Éxito -->
        <linearGradient id="maximus-arrow-green" x1="10" y1="24" x2="29" y2="3" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#059669"/>
            <stop offset="50%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#34D399"/>
        </linearGradient>

        <!-- Sombra para profundidad de relieve tridimensional -->
        <filter id="maximus-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Estructura Arquitectónica Plateada (Casa y Monograma "M") -->
    <g filter="url(#maximus-shadow)">
        <!-- Chimenea clásica del logo -->
        <rect x="7.4" y="6" width="2.4" height="6.5" rx="0.5" fill="url(#maximus-house-silver)"/>

        <!-- Pilares laterales de soporte -->
        <path d="M6 17.5V26.5" stroke="url(#maximus-house-silver)" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M24.5 17.5V26.5" stroke="url(#maximus-house-silver)" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Techo a dos aguas con alero -->
        <path d="M3.5 17.5L15 7.5L26.5 17.5" stroke="url(#maximus-house-silver)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Flecha Dinámica Verde Ascendente (Inversión, Crecimiento y Captaciones Maximus) -->
    <g filter="url(#maximus-shadow)">
        <!-- Trazado en check / despegue -->
        <path d="M10.5 15.5L15 21L24.2 9.2" stroke="url(#maximus-arrow-green)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Punta de flecha superior derecha en ángulo de proyección -->
        <polygon points="29,4 21.5,6.8 26.2,13.8" fill="url(#maximus-arrow-green)"/>
    </g>
</svg>
