<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B4A3F">
    <meta name="robots" content="noindex">
    <title>Llegada a tu visita | MAXIMUS Inmobiliaria</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { 'maximus-dark': '#0B4A3F', 'maximus-accent': '#10B981' },
                fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
            } }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/config.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #EEF3F1; }
        @keyframes aparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .aparece { animation: aparece .45s ease-out both; }
        @media (prefers-reduced-motion: reduce) { .aparece, .animate-spin { animation: none; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4 py-10 text-gray-800">
    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <span class="text-2xl font-extrabold tracking-tight text-maximus-dark">MAXIMUS<span class="text-maximus-accent">.</span></span>
        </div>

        <div id="estado-cargando" class="bg-white rounded-3xl shadow-xl p-8 text-center">
            <i class="ph ph-circle-notch animate-spin text-3xl text-maximus-accent"></i>
            <p class="mt-3 text-sm text-gray-500">Registrando tu llegada…</p>
        </div>

        <div id="estado-ok" class="hidden aparece bg-white rounded-3xl shadow-xl overflow-hidden">
            <div class="bg-gradient-to-br from-[#0B2B25] to-[#0B4A3F] text-white p-6 text-center">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-white/15 flex items-center justify-center text-3xl"><i class="ph-fill ph-check-circle"></i></div>
                <h1 id="ok-titulo" class="mt-3 text-2xl font-extrabold">¡Bienvenido!</h1>
                <p class="mt-1 text-sm text-white/80">Tu llegada quedó registrada.</p>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Inmueble</p>
                    <p id="ok-inmueble" class="text-base font-extrabold text-maximus-dark"></p>
                    <p id="ok-ubicacion" class="text-xs text-gray-500"></p>
                </div>
                <div>
                    <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Te recibe</p>
                    <p id="ok-asesor" class="text-base font-bold text-gray-800"></p>
                </div>
                <a id="ok-whatsapp" href="#" target="_blank" rel="noopener" class="hidden w-full h-12 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold flex items-center justify-center gap-2 transition">
                    <i class="ph-fill ph-whatsapp-logo text-lg"></i> Avisar a mi asesor que llegué
                </a>
                <a href="/login" class="w-full h-11 rounded-xl border border-gray-200 text-gray-600 text-sm font-semibold flex items-center justify-center gap-2 hover:bg-gray-50 transition">
                    <i class="ph ph-user"></i> Entrar a mi portal
                </a>
            </div>
        </div>

        <div id="estado-error" class="hidden aparece bg-white rounded-3xl shadow-xl p-8 text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-3xl"><i class="ph-fill ph-warning"></i></div>
            <h1 class="mt-3 text-xl font-extrabold text-maximus-dark">No pudimos registrar tu llegada</h1>
            <p class="mt-2 text-sm text-gray-500">El código no es válido o la visita fue cancelada. Escríbele a tu asesor y te atenderá igual.</p>
        </div>
    </div>

<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    function mostrar(cual) {
        ['cargando', 'ok', 'error'].forEach(k => $('estado-' + k).classList.toggle('hidden', k !== cual));
    }

    async function registrar() {
        const q = new URLSearchParams(location.search);
        const cita = (q.get('c') || '').slice(0, 80);
        const token = (q.get('t') || '').replace(/[^a-f0-9]/gi, '').slice(0, 64);
        if (!cita || !token) return mostrar('error');

        const url = (window.APP_CONFIG && APP_CONFIG.SUPABASE_URL || '').replace(/\/$/, '');
        const key = window.APP_CONFIG && APP_CONFIG.SUPABASE_ANON_KEY;
        if (!url || !key) return mostrar('error');

        let d = null;
        try {
            const r = await fetch(url + '/rest/v1/rpc/registrar_llegada_visita', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: key, Authorization: 'Bearer ' + key },
                body: JSON.stringify({ p_cita_id: cita, p_token: token })
            });
            if (r.ok) d = await r.json();
        } catch (_) {}
        if (!d || !d.ok) return mostrar('error');

        $('ok-titulo').textContent = d.cliente ? `¡Bienvenido, ${d.cliente}!` : '¡Bienvenido!';
        $('ok-inmueble').textContent = d.inmueble || 'Visita MAXIMUS';
        $('ok-ubicacion').textContent = d.ubicacion || '';
        $('ok-asesor').textContent = d.asesor || 'Tu asesor MAXIMUS';
        const tel = String(d.asesor_telefono || '').replace(/\D/g, '');
        if (tel) {
            const msg = encodeURIComponent(`Hola, ya llegué a la visita${d.inmueble ? ' de "' + d.inmueble + '"' : ''}.`);
            const a = $('ok-whatsapp');
            a.href = `https://wa.me/${tel}?text=${msg}`;
            a.classList.remove('hidden');
        }
        // Quitar el código de la barra de direcciones
        try { history.replaceState(null, '', location.pathname); } catch (_) {}
        mostrar('ok');
    }
    registrar();
})();
</script>
</body>
</html>
